<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallsHackPro</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<style>
  :root {
    --bg: #0b0d12;
    --surface: #11141c;
    --border: #1f2430;
    --text: #e6e8ee;
    --text-2: #9aa1b0;
    --text-3: #5c6472;
    --accent: #7c5cff;
    --accent-hover: #8d72ff;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  a { color: inherit; text-decoration: none; }
  .page { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  /* ── 顶部 ── */
  .nav {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 24px;
    margin: 0 -24px;
    font-size: 14px;
    background: rgba(11,13,18,.82);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav .slogan {
    font-style: italic;
    font-weight: 500;
    color: var(--accent);
    font-size: 13px;
    letter-spacing: .4px;
  }
  .nav .links { margin-left: auto; display: flex; align-items: center; gap: 22px; }
  .nav .links a { color: var(--text-2); font-size: 13px; position: relative; transition: color .15s; }
  .nav .links a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
    height: 1px; background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform .2s;
  }
  .nav .links a:hover { color: var(--text); }
  .nav .links a:hover::after { transform: scaleX(1); }
  .btn.btn-sm {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
    height: 24px;
    font-size: 12px;
    line-height: 1;
    margin-left: 18px;
    border-radius: 6px;
  }

  /* ── 主区 ── */
  .hero { padding: 64px 0 56px; }
  .hero .app-icon {
    width: 88px; height: 88px;
    border-radius: 18px;
    margin-bottom: 22px;
  }
  .hero h1 {
    font-size: clamp(34px, 7.5vw, 46px);
    font-weight: 700;
    font-style: italic;
    letter-spacing: -.5px;
    background: linear-gradient(90deg, var(--text) 40%, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero .sub { margin-top: 10px; font-size: 15px; color: var(--text-2); }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
  .btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: var(--radius);
    font-size: 14px; font-weight: 500;
    border: 1px solid transparent;
    cursor: pointer;
    text-align: center;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 0 0 rgba(124,92,255,0); }
  .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 24px rgba(124,92,255,.35); }
  .btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: #2c3342; }
  .hint { margin-top: 14px; font-size: 12px; color: var(--text-3); }

  /* ── 功能 ── */
  .features { border-top: 1px solid var(--border); padding: 44px 0 56px; }
  .features h2 { font-size: 15px; font-weight: 600; margin-bottom: 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .cell {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: border-color .15s, background .15s;
  }
  .cell:hover { border-color: #2c3342; background: #141824; }
  .cell .icon { width: 18px; height: 18px; color: var(--accent); margin-top: 2px; flex-shrink: 0; }
  .cell .body { min-width: 0; }
  .cell .name { font-size: 14px; font-weight: 550; }
  .cell .desc { margin-top: 2px; font-size: 12.5px; color: var(--text-2); }
  .cell.wide { grid-column: 1 / -1; }

  /* ── 底部 ── */
  .footer { border-top: 1px solid var(--border); padding: 22px 0 40px; font-size: 12.5px; color: var(--text-3); }
  .footer a { color: var(--text-2); }
  .footer a:hover { color: var(--text); }
  .footer .copy { margin-top: 6px; }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .cell.wide { grid-column: auto; }
  }
  @media (max-width: 480px) {
    .page { padding: 0 16px; }
    .nav { margin: 0 -16px; padding: 12px 16px; }
    .nav .links { gap: 10px; }
    .nav .links a { font-size: 12px; }
    .btn.btn-sm { padding: 0 10px; }
    .hero { padding: 40px 0 36px; }
    .hero .app-icon { width: 72px; height: 72px; border-radius: 15px; }
    .hero .sub { font-size: 14px; line-height: 1.55; }
    .cell { padding: 14px; }
  }
  @media (max-width: 420px) {
    .hero { padding: 36px 0 32px; }
    .cta { flex-direction: column; align-items: stretch; }
    .btn { text-align: center; }
    .nav .links { gap: 12px; }
    .nav .slogan { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .cell, a { transition: none; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="nav">
    <span class="slogan">支持绿色球球，重建球宝家园</span>
    <div class="links">
      <a href="https://github.com/SoloHomie/BallsHackPro-Public" target="_blank" rel="noopener">GitHub</a>
      <a href="https://discord.gg/YtvJrFvcC5" target="_blank" rel="noopener">Discord</a>
      <a class="btn btn-primary btn-sm" href="/api/download">Windows 下载</a>
    </div>
  </div>

  <header class="hero">
    <img class="app-icon" src="/favicon.png?v=2" alt="BallsHackPro 图标">
    <h1>BallsHackPro</h1>
    <p class="sub">为球宝而生。锁定目标、流畅合球、精准调控，游戏体验全面升级。</p>
    <div class="cta">
      <a class="btn btn-ghost" href="https://github.com/SoloHomie/BallsHackPro-Public/releases" target="_blank" rel="noopener">查看发布记录</a>
    </div>
    <p class="hint">启动器约 26 MB，首次启动自动下载完整客户端。仅支持 Windows 10 及以上版本。</p>
  </header>

  <section class="features" id="features">
    <h2>主要功能</h2>
    <div class="grid">
      <div class="cell">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <div class="body"><div class="name">锁定</div><div class="desc">自动追踪目标，跟随移动</div></div>
      </div>
      <div class="cell">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h4a4 4 0 0 1 4 4v8"/><path d="M20 8h-4a4 4 0 0 0-4 4"/><path d="M4 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM20 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
        <div class="body"><div class="name">合球</div><div class="desc">三角、四分、冲刺、旋转等八种合球动作</div></div>
      </div>
      <div class="cell">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg>
        <div class="body"><div class="name">调控</div><div class="desc">视野、速度等参数，内存级调参</div></div>
      </div>
      <div class="cell">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <div class="body"><div class="name">同步</div><div class="desc">双端同步与远程协助</div></div>
      </div>
      <div class="cell wide">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>
        <div class="body"><div class="name">美化</div><div class="desc">皮肤、光环等外观自由定制</div></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <a href="https://github.com/SoloHomie" target="_blank" rel="noopener">SoloHomie</a>
    <div class="copy">© 2026 BallsHackPro</div>
  </footer>

</div>

</body>
</html>
