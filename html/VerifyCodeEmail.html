<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BallsHackPro 验证码</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
        <tr>
            <td align="center">
                <table cellpadding="0" cellspacing="0" style="max-width:440px;width:100%;background:#fff;border-radius:12px;border:1px solid #e5e5e5;">
                    <tr>
                        <td style="padding:36px 32px 28px;">
                            <table cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
                                <tr>
                                    <td style="font-size:20px;font-weight:600;color:#111;">BallsHackPro</td>
                                </tr>
                            </table>

                            <table cellpadding="0" cellspacing="0" style="margin-bottom:8px;">
                                <tr>
                                    <td style="font-size:24px;font-weight:700;color:#111;">{{LABEL}}验证码</td>
                                </tr>
                            </table>

                            <table cellpadding="0" cellspacing="0" style="margin-bottom:28px;">
                                <tr>
                                    <td style="font-size:14px;color:#666;line-height:1.6;">{{DESC}}</td>
                                </tr>
                            </table>

                            <table cellpadding="0" cellspacing="0" style="margin-bottom:24px;width:100%;">
                                <tr>
                                    <td align="center" style="background:#f8f8f8;border-radius:8px;padding:20px 16px;">
                                        <span style="font-size:38px;font-weight:700;color:#111;font-family:'SF Mono','Consolas',monospace;letter-spacing:12px;">{{CODE}}</span>
                                    </td>
                                </tr>
                            </table>

                            <table cellpadding="0" cellspacing="0" style="margin-bottom:28px;">
                                <tr>
                                    <td style="font-size:13px;color:#999;">{{TTL_MIN}} 分钟后失效，如非本人操作请忽略</td>
                                </tr>
                            </table>

                            <table cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="border-top:1px solid #eee;padding-top:20px;font-size:12px;color:#bbb;">
                                        此邮件由系统自动发送，请勿回复
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
