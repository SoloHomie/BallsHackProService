# BallsHackProService — Docker 依赖服务
# 启动:  docker compose up -d
# 停止:  docker compose down

services:
  mysql:
    image: mysql:8.0
    container_name: bhpro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: balls_hack_pro
      MYSQL_USER: bhpro_app
      MYSQL_PASSWORD: bhpro_pass
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: bhpro-redis
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: bhpro-mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: bhpro-adminer
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
