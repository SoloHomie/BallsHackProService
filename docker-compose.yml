services:
  app:
    build: .
    container_name: bhpro-app
    network_mode: host
    env_file:
      - .env
    volumes:
      - bhpro_releases:/app/releases
      - ./pricing.json:/app/pricing.json
      - ./announcement.json:/app/announcement.json
      - ./guide.json:/app/guide.json
      - ./version.json:/app/version.json
    restart: unless-stopped

volumes:
  bhpro_releases:
    external: true
